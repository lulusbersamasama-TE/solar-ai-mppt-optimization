name: Notebook static syntax (not data execution)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notebook-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight numeric dependency
        run: python -m pip install numpy
      - name: Validate Python code in all notebook cells
        run: python scripts/check_notebook_syntax.py
      - name: Smoke-test controller mathematics and update ordering
        run: python scripts/check_controller_smoke.py
